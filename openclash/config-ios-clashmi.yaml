  - {name: 🇭🇰HK-Auto, type: url-test, lazy: true, url: 'http://www.gstatic.com/generate_204', interval: 1200, tolerance: 20, include-all: true, exclude-type: direct, hidden: true, filter: '(🇭🇰|港|HK|(?i)Hong)', timeout: 5000, expected-status: 204}
  - {name: 🇨🇳TW-Auto, type: url-test, lazy: true, url: 'http://www.gstatic.com/generate_204', interval: 1200, tolerance: 30, include-all: true, exclude-type: direct, hidden: true, filter: '(台|TW|(?i)Taiwan)', timeout: 5000, expected-status: 204}
  - {name: 🇯🇵JP-Auto, type: url-test, lazy: true, url: 'http://www.gstatic.com/generate_204', interval: 1200, tolerance: 30, include-all: true, exclude-type: direct, hidden: true, filter: '(🇯🇵|日|JP|(?i)Japan)', timeout: 5000, expected-status: 204}
  - {name: 🇸🇬SG-Auto, type: url-test, lazy: true, url: 'http://www.gstatic.com/generate_204', interval: 1200, tolerance: 30, include-all: true, exclude-type: direct, hidden: true, filter: '(🇸🇬|新加坡|狮|獅|SG|(?i)Singapore)', timeout: 5000, expected-status: 204}
