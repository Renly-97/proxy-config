# Clash Mi / iOS 公版配置 — 2026-10-04
# 分流策略、DNS 和规则集在本文件维护；节点及个人规则由本地覆写补充。
# 自用
# 配套使用：
# 1. 使用本文件的 Raw URL 添加远程配置。
# 2. 将 clashmi-private-override.js 作为本地“覆写”导入，类型选 js。
# 3. 本配置的“核心覆写”选择该本地覆写；本地覆写的“追加覆写”选“内置-不覆写”。
# 4. 私人文件中的订阅地址和 Token 只保存在本地；远程主配置更新后仍使用本地覆写。
# 公版自身不提供代理节点；首次使用前须填好私人覆写。
#
# 配置说明：
# - 通用代理域名/IP 使用远程 MRS；177 条关键词/正则为 2026-10-04 内置快照。
#   远程表自动更新，内置快照需随本文件维护。
# - 国内网段使用纯 CIDR 表；不依赖 GeoSite、GeoIP、ASN 数据库。
# - AI 使用 QuixoticHeart 的 AI 规则源。
# - 保留流媒体、AI、地区手选/自动、媒体主备等策略组；Final 默认 DIRECT。
# - 地区自动检测间隔 20 分钟且 lazy；媒体备用检测间隔 5 分钟。
# - DNS 使用直连 DoH、fake-ip；推送及 Wi-Fi 登录检测有直接连接例外。
# - iOS TUN 接口由 App 管理；原生设备行为仍以手机实测为准。
#

# ---------- 基础设置 ----------
mode: rule
log-level: warning
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
find-process-mode: 'off'
ipv6: true
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30
keep-alive-idle: 600
profile:
  store-selected: true
  store-fake-ip: true
tun:
  enable: true
  stack: gvisor
  mtu: 1280
  dns-hijack:
  - any:53
  - tcp://any:53
sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: false
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com

# ---------- DNS ----------
dns:
  enable: true
  prefer-h3: false
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.localhost'
  - time.*.com
  - ntp.*.com
  - pool.ntp.org
  - '*.pool.ntp.org'
  - time.windows.com
  - time.apple.com
  - time.google.com
  - mtalk.google.com
  - alt[1-8]-mtalk.google.com
  - +.push.apple.com
  - captive.apple.com
  - localhost.ptlogin2.qq.com
  - '*.mcdn.bilivideo.cn'
  - +.bilibili.com
  - +.bilicdn.com
  - +.bilivideo.com
  - +.stun.*.*
  - +.stun.*.*.*
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  direct-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT

# ---------- 节点由本地覆写提供 ----------
proxies: []
proxy-providers: {}

