  - {name: Adobe, type: select, proxies: [sProxy, DIRECT, 🇭🇰HK, 🇨🇳TW, 🇯🇵JP, 🇸🇬SG, 🇺🇸US, 🇭🇰HK-Auto, 🇨🇳TW-Auto, 🇯🇵JP-Auto, 🇸🇬SG-Auto, 🇺🇸US-Auto]}
