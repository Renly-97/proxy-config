  - {name: Microsoft, type: select, proxies: [DIRECT, sProxy, 🇭🇰HK, 🇨🇳TW, 🇯🇵JP, 🇸🇬SG, 🇺🇸US, 🇭🇰HK-Auto, 🇨🇳TW-Auto, 🇯🇵JP-Auto, 🇸🇬SG-Auto, 🇺🇸US-Auto]}
