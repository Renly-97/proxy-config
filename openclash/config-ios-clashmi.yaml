# Clash Mi / iOS 优化试用版 — 2026-10-04
#
# 导入前必须补充：
# 1. 源文件没有节点；下方 proxy-providers 仍为空。导入手机的私人订阅覆写，
#    或按下方注释示例填写自己的 Clash / Mihomo 节点订阅。
# 2. 两个 Emby-Private-* 使用 GitHub 私库 API。已补 Accept 原始文件请求头，
#    还需在 x-emby-private-headers 中填写自己的只读 Token，或由私人覆写注入。
# 3. 此文件不含 F1/F3 合并模块；原通用配置本身也没有该模块。
#    OpenClash 的 shell 覆写及 Verge 的 JS 扩展不能直接作为 Clash Mi 配置使用。
#
# Clash Mi 导入建议：此配置选择“内置-不覆写”（若版本使用其他文案，选择保留
# 订阅自身 DNS/嗅探设置）；TUN 使用 App 的 iOS 默认设置。内置面板/secret 由 App 管理。
# 首次下载订阅/规则若无法直连，可先连接现有 QX 下载，再切换到 Clash Mi 测试。
#
# 主要变化：
# - 移除外部面板下载、Geo 数据库地址、Linux 自动路由及未引用的模板/图标。
# - DNS 保留原来的国内直连 DoH；删除效果相同的 GeoSite DNS 分支，避免额外加载。
# - 不再对全部中国域名强制返回真实 IP；保留局域网/时间同步，并补 APNs、登录门户等例外。
# - 通用代理表的域名/IP 改用原作者的 MRS，已核对生成时内容与旧表对应部分一致。
# - 177 条原关键词/正则保留在 rule_proxy-extra，属于 2026-10-04 的兼容快照；
#   MRS 主表会自动更新，这 177 条不会单独自动更新。
# - Geo_AS_CN 改为原作者的纯 CIDR 格式，保留其全部 IPv4/IPv6 网段及免解析行为。
# - AI 改为 QuixoticHeart 持续更新的无 ASN AI 表，覆盖主要海外 AI；
#   与原 AI 大表覆盖范围不同，原来被泛化纳入 AI 的非 AI 服务恢复后续常规分流。
# - 保留 29 个原策略组、地区手选/自动、Emby 首选/备用、原 Final 默认直连。
# - 地区自动测速改为 20 分钟且按需执行；Emby 备用检测仍为 5 分钟。
# - 补充 Apple 推送与 Wi-Fi 登录检测直连；健康检测只接受 HTTP 204。
#

# ---------- iOS 基础设置 ----------
mode: rule
log-level: warning
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
find-process-mode: 'off'
ipv6: true
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30
keep-alive-idle: 600
profile:
  store-selected: true
  store-fake-ip: true
tun:
  enable: true
  stack: gvisor
  mtu: 1280
  dns-hijack:
  - any:53
  - tcp://any:53
sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: false
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com

# ---------- DNS：不依赖代理组引导启动 ----------
dns:
  enable: true
  prefer-h3: false
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.localhost'
  - time.*.com
  - ntp.*.com
  - pool.ntp.org
  - '*.pool.ntp.org'
  - time.windows.com
  - time.apple.com
  - time.google.com
  - mtalk.google.com
  - alt[1-8]-mtalk.google.com
  - +.push.apple.com
  - captive.apple.com
  - localhost.ptlogin2.qq.com
  - '*.mcdn.bilivideo.cn'
  - +.bilibili.com
  - +.bilicdn.com
  - +.bilivideo.com
  - +.stun.*.*
  - +.stun.*.*.*
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  direct-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT

# ---------- 节点：需要你自己的订阅或私人覆写 ----------
# 请直接编辑下面的 proxy-providers 字典；不要再追加第二个同名顶层键。
# 示例（去掉注释后，替换为自己的订阅；多个订阅使用不同名称和 path）：
# proxy-providers:
#   F1:
#     type: http
#     url: "填写你的 ClashMeta 订阅地址"
#     path: ./ProxyProvider/F1.yaml
#     interval: 259200
#     proxy: DIRECT
#     override:
#       additional-prefix: "[F1] "
#     health-check:
#       enable: true
#       url: http://www.gstatic.com/generate_204
#       interval: 1800
#       lazy: true
#       expected-status: 204
proxies: []
proxy-providers: {}

