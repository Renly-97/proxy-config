# Date: 2026-10-01
# Meta文档：https://github.com/MetaCubeX/mihomo/blob/Meta/docs/config.yaml
# 参考1：https://github.com/Repcz/Tool/blob/X/mihomo/Client/config.yaml
# 参考2: https://github.com/Tartarus2014/For-own-use/blob/master/MY/Clash.tpl

# 代理提供者模板 - 订阅源基础配置
SubBase: &SubBase { type: http, interval: 259200, proxy: DIRECT, health-check: { enable: true, url: 'http://www.gstatic.com/generate_204', interval: 1800 }, filter: '^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))' }

# ==================== 本地代理 ====================
proxies:
#__placeholder__

# ==================== 代理提供者 ====================
# 真实订阅由 OpenClash 本地覆写模块注入，Public GitHub 不保存订阅 URL / Token
proxy-providers: {}
# ==================== 核心配置 ====================
# 混合端口 HTTP和SOCKS5用一个端口
# port: 7890
# socks-port: 7891
# redir-port: 7892
mixed-port: 7890
# tproxy-port: 7895

allow-lan: false
#  find-process-mode has 3 values:always, strict, off
#  - always, 开启，强制匹配所有进程
#  - strict, 默认，由 mihomo 判断是否开启
#  - off, 不匹配进程，推荐在路由器上使用此模式
find-process-mode: strict
# 全局 TLS 指纹
# global-client-fingerprint: chrome
# enable-process: true

# 规则模式：rule/global/direct/script
mode: rule

# 设置日志输出级别：silent / error / warning / info / debug。级别越高日志输出量越大，越倾向于调试，若需要请自行开启。
log-level: info
# 开启 IPv6 总开关，关闭阻断所有 IPv6 链接和屏蔽 DNS 请求 AAAA 记录
ipv6: true
# 是否允许 UDP 通过代理，默认为 false。此选项在 TUIC 等基于 UDP 的协议以及 direct 和 dns 类型中默认开启
udp: true

# 统一延迟。更换延迟计算方式,去除握手等额外延迟
unified-delay: true
# TCP 并发。同时对所有ip进行连接，返回延迟最低的地址
tcp-concurrent: true

bind-address: '*'
keep-alive-interval: 15
keep-alive-idle: 600


# 认证信息如有需要，请通过 OpenClash 本地覆写注入，不放 Public GitHub

# 实验性功能
experimental:
  quic-go-disable-gso: true

# 管理面板配置
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090


# 使用geoip.dat数据库
geodata-mode: true
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

# 缓存
profile:
  # 储存 API 对策略组的选择，以供下次启动时使用
  store-selected: true
  # 储存 fakeip 映射表，域名再次发生连接时，使用原有映射地址
  store-fake-ip: true

# Tun 配置
tun:
  enable: true
  # stack
  # tun 模式堆栈，如无使用问题，建议使用 mixed栈，默认 gvisor
  # 可用值： system/gvisor/mixed
  # system 使用系统协议栈，可以提供更稳定/全面的 tun 体验，且占用相对其他堆栈更低
  # gvisor 通过在用户空间中实现网络协议栈，可以提供更高的安全性和隔离性，同时可以避免操作系统内核和用户空间之间的切换，从而在特定情况下具有更好的网络处理性能
  # mixed 混合堆栈，tcp 使用 system栈，udp 使用 gvisor栈，使用体验可能相对更好
  stack: mixed
  dns-hijack:
    - "tcp://any:53"
    - "udp://any:53"
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true

# 嗅探域名
sniffer:
  enable: true
  # 对 redir-host 类型识别的流量进行强制嗅探
  force-dns-mapping: true
  # 对所有未获取到域名的流量进行强制嗅探
  parse-pure-ip: true
  # 是否使用嗅探结果作为实际访问
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  # 需要跳过嗅探的域名, 主要解决部分站点 sni 字段非域名, 导致嗅探结果异常的问题, 如米家设备
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"


# DNS 配置
dns:
  # 关闭将使用系统 DNS
  enable: true
  # 是否开启 DoH 支持 HTTP/3，将并发尝试
  prefer-h3: false
  # 开启 DNS 服务器监听
  listen: 0.0.0.0:1053
  # 启用IPv6解析
  ipv6: false
  # 自适应替换缓存算法
  cache-algorithm: chrome
  # 模式：redir-host或fake-ip
  enhanced-mode: fake-ip
  # fake-ip 池设置
  fake-ip-range: 198.18.0.1/16
  # 配置不使用 fake-ip 的域名
  fake-ip-filter:
    # 本地域名
    - "*.lan"
    - "*.local"
    - "*.localhost"
    # NTP时间服务器
    - "time.*.com"
    - "ntp.*.com"
    - "pool.ntp.org"
    - "*.pool.ntp.org"
    - "time.windows.com"
    - "time.apple.com"
    - "time.google.com"
    # 中国大陆网站
    - "geosite:cn"
    # Google Talk服务
    - "mtalk.google.com"
    - "alt[1-8]-mtalk.google.com"
  # 用于解析 DoH/DoT 域名的基础 DNS
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # DIRECT 流量使用国内公共 DoH
  direct-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT

  # 代理节点服务器域名解析必须可在节点尚未加载时直接工作
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT

  # 根据域名分流 DNS。这里全部走 DIRECT，避免启动阶段依赖 sProxy
  nameserver-policy:
    "geosite:cn":
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
    "geosite:geolocation-!cn":
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT

  # 默认兜底同样不依赖任何代理组，保证 proxy-provider 能先正常加载
  nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT


# 策略组类型模板 - 定义不同的策略组基础配置
use: &use1 { type: select, include-all: true, exclude-type: direct } #手动选择——展开所有节点
auto: &auto1 { type: url-test, lazy: true, url: "http://www.gstatic.com/generate_204", interval: 600, tolerance: 30, include-all: true, exclude-type: direct, hidden: true } #自动测速——展开所有节点
fallback: &fall1 { type: fallback, interval: 600, lazy: true, url: 'http://www.gstatic.com/generate_204' }
emby-backup: &embybackup { type: fallback, interval: 300, timeout: 5000, lazy: true, url: 'http://www.gstatic.com/generate_204', include-all: true, exclude-type: direct, hidden: true } # Emby备用池：5分钟健康检查，仅首选路径不可用时接管
smart: &smart1 { type: smart, interval: 600, lazy: true, url: 'http://www.gstatic.com/generate_204', hidden: true, uselightgbm: true }

# 节点筛选正则表达式 - 基于地理位置和关键词过滤
FilterHK: &FilterHK '(🇭🇰|港|HK|(?i)Hong)'
FilterHKLOW: &FilterHKLOW '(🇭🇰|港|HK|(?i)Hong).*(0\.[0-9]\d{0,3}[\d(x|×)])'
FilterTW: &FilterTW '(台|TW|(?i)Taiwan)'
FilterTWLOW: &FilterTWLOW '(台|TW|(?i)Taiwan).*(0\.[0-9]\d{0,3}[\d(x|×)])'
FilterJP: &FilterJP '(🇯🇵|日|JP|(?i)Japan)'
FilterJPLOW: &FilterJPLOW '(🇯🇵|日|JP|(?i)Japan).*(0\.[0-9]\d{0,3}[\d(x|×)])'
FilterSG: &FilterSG '(🇸🇬|新加坡|狮|獅|SG|(?i)Singapore)'
FilterSGLOW: &FilterSGLOW '(🇸🇬|新加坡|狮|獅|SG|(?i)Singapore).*(0\.[0-9]\d{0,3}[\d(x|×)])'
FilterKR: &FilterKR '(🇰🇷|韩|韓|KR|(?i)Korea)'
FilterKRLOW: &FilterKRLOW '(🇰🇷|韩|韓|KR|(?i)Korea).*(0\.[0-9]\d{0,3}[\d(x|×)])'
FilterUS: &FilterUS '(🇺🇸|美|US|(?i)States|American)'
FilterUSLOW: &FilterUSLOW '(🇺🇸|美|US|(?i)States|American).*(0\.[0-9]\d{0,3}[\d(x|×)])'
FilterOT: &FilterOT '(?xi)^(?! .* (?:🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港|🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b|🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b|🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b|🇰🇷|韩国|首尔|仁川|Korea|South\s*Korea|\b(?:KOR|KR|ICN|SEL)\b|🇺🇸|美国|United\s*States|America|\bUSA?\b|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|\b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b|倍率|剩余|到期|流量|官网|订阅|测试|有效|禁止|邮箱|客服|地址|网站|群组)).+$'

# 策略组代理列表模板 - 预定义的代理节点优先级排序
a0: &a0 { type: select, proxies: [ 🇭🇰HK,🇨🇳TW,🇯🇵JP,🇸🇬SG,🇺🇸US,🇭🇰HK-Auto,🇨🇳TW-Auto,🇯🇵JP-Auto,🇸🇬SG-Auto,🇺🇸US-Auto,DIRECT ] }
s1: &s1 { type: select, proxies: [ DIRECT,sProxy ] }
s2: &s2 { type: select, proxies: [ sProxy,DIRECT ] }
g1: &g1 { type: select, proxies: [ sProxy,🇭🇰HK,🇨🇳TW,🇯🇵JP,🇸🇬SG,🇺🇸US,🇭🇰HK-Auto,🇨🇳TW-Auto,🇯🇵JP-Auto,🇸🇬SG-Auto,🇺🇸US-Auto ] } #纯代理
g2: &g2 { type: select, proxies: [ sProxy,DIRECT,🇭🇰HK,🇨🇳TW,🇯🇵JP,🇸🇬SG,🇺🇸US,🇭🇰HK-Auto,🇨🇳TW-Auto,🇯🇵JP-Auto,🇸🇬SG-Auto,🇺🇸US-Auto ] } #代理优先+手动选择
g3: &g3 { type: select, proxies: [ DIRECT,sProxy,🇭🇰HK,🇨🇳TW,🇯🇵JP,🇸🇬SG,🇺🇸US,🇭🇰HK-Auto,🇨🇳TW-Auto,🇯🇵JP-Auto,🇸🇬SG-Auto,🇺🇸US-Auto ] } #直连优先+手动选择
g4: &g4 { type: select, proxies: [ 🇭🇰HK,🇨🇳TW,🇯🇵JP,🇸🇬SG,🇺🇸US ] } #手动优先
ai1: &ai1 { type: select, proxies: [ 🇺🇸US,🇨🇳TW,🇯🇵JP,🇸🇬SG ] } #AI特定

