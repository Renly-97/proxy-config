# OpenClash 家庭旁路由远程覆写模块
# 保留公共规则/策略组/Emby/节点筛选以外；这里只固定“家里旁路由”的运行环境差异。

[General]
EN_MODE = fake-ip-mix
IPV6_ENABLE = 1
IPV6_DNS = 0
STACK_TYPE = mixed
PROXY_MODE = rule
RESTART = true

[YAML]
allow-lan: true
bind-address: '*'

dns:
  listen: 0.0.0.0:1053
  ipv6: false

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "tcp://any:53"
    - "udp://any:53"
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
