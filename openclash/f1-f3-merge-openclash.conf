# F1 / F3 同机场节点合并模块（OpenClash 当前覆写模块语法）
# 作用：
# 1) 将 F1/F3 的 HK/JP/SG/US 01/02 两两合并为 url-test；
# 2) 地区组中隐藏原始 [F1]/[F3] 节点，仅加入合并后的 01/02；
# 3) Johnny 等其他节点完全不动；
# 4) 停用/删除本模块后，原始 config.yaml 不会被修改。

[General]
RESTART = true

[YAML]
proxy-groups+:
  - name: 香港01
    type: url-test
    include-all: true
    exclude-type: direct
    filter: '^\[(?:F1|F3)\].*香港.*(?:\||\s)0?1$'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    timeout: 5000
    tolerance: 20
    lazy: true
    expected-status: 204
    hidden: true
  - name: 香港02
    type: url-test
    include-all: true
    exclude-type: direct
    filter: '^\[(?:F1|F3)\].*香港.*(?:\||\s)0?2$'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    timeout: 5000
    tolerance: 20
    lazy: true
    expected-status: 204
    hidden: true
  - name: 日本01
