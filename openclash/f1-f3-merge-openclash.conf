# F1 / F3 自用同机场节点合并模块（OpenClash）
# 功能：把 F1/F3 的 HK/JP/SG/US 01/02 各自合并成 url-test；
#      原始 [F1]/[F3] 节点从对应地区组隐藏，只显示合并后的节点组。
# 删除/停用本模块后，原 config.yaml 不会被修改，OpenClash 会恢复原始行为。

[General]
RESTART = true

[Overwrite]
ruby -KU -ryaml -E UTF-8 -e "
path = ARGV[0]
cfg = YAML.load_file(path, aliases: true)
groups = cfg['proxy-groups'] ||= []

merged = [
  ['香港01',   '^\\[(?:F1|F3)\\].*香港.*(?:\\||\\s)0?1$'],
  ['香港02',   '^\\[(?:F1|F3)\\].*香港.*(?:\\||\\s)0?2$'],
  ['日本01',   '^\\[(?:F1|F3)\\].*日本.*(?:\\||\\s)0?1$'],
  ['日本02',   '^\\[(?:F1|F3)\\].*日本.*(?:\\||\\s)0?2$'],
  ['新加坡01', '^\\[(?:F1|F3)\\].*新加坡.*(?:\\||\\s)0?1$'],
  ['新加坡02', '^\\[(?:F1|F3)\\].*新加坡.*(?:\\||\\s)0?2$'],
  ['美国01',   '^\\[(?:F1|F3)\\].*美国.*(?:\\||\\s)0?1$'],
  ['美国02',   '^\\[(?:F1|F3)\\].*美国.*(?:\\||\\s)0?2$']
]

merge_names = merged.map { |x| x[0] }
groups.reject! { |g| g.is_a?(Hash) && merge_names.include?(g['name']) }

merged.each do |name, filter|
  groups << {
    'name' => name,
    'type' => 'url-test',
    'include-all' => true,
    'exclude-type' => 'direct',
    'filter' => filter,
    'url' => 'https://www.gstatic.com/generate_204',
    'interval' => 300,
    'timeout' => 5000,
    'tolerance' => 20,
    'lazy' => true,
    'expected-status' => 204,
    'hidden' => true
  }
end

region_map = {
  '🇭🇰HK' => ['香港01', '香港02'],
  '🇭🇰HK-Auto' => ['香港01', '香港02'],
  '🇯🇵JP' => ['日本01', '日本02'],
  '🇯🇵JP-Auto' => ['日本01', '日本02'],
  '🇸🇬SG' => ['新加坡01', '新加坡02'],
  '🇸🇬SG-Auto' => ['新加坡01', '新加坡02'],
  '🇺🇸US' => ['美国01', '美国02'],
  '🇺🇸US-Auto' => ['美国01', '美国02']
}

hide_filter = '^\\[(?:F1|F3)\\]'
region_map.each do |group_name, additions|
  g = groups.find { |x| x.is_a?(Hash) && x['name'] == group_name }
  next unless g

  old_exclude = g['exclude-filter'].to_s
  g['exclude-filter'] = if old_exclude.empty? || old_exclude == hide_filter
                          hide_filter
                        else
                          '(?:' + old_exclude + ')|(?:' + hide_filter + ')'
                        end

  g['proxies'] = Array(g['proxies'])
  additions.each { |n| g['proxies'] << n unless g['proxies'].include?(n) }
end

File.open(path, 'w') { |f| f.write(YAML.dump(cfg)) }
" "$CONFIG_FILE"
