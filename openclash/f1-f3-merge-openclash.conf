    exclude-type: direct
    filter: '^\[(?:F1|F3)\].*新加坡.*(?:\||\s)0?1$'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    timeout: 5000
    tolerance: 20
    lazy: true
    expected-status: 204
    hidden: true
  - name: 新加坡02
    type: url-test
    include-all: true
    exclude-type: direct
    filter: '^\[(?:F1|F3)\].*新加坡.*(?:\||\s)0?2$'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    timeout: 5000
    tolerance: 20
    lazy: true
    expected-status: 204
    hidden: true
  - name: 美国01
    type: url-test
    include-all: true
    exclude-type: direct
    filter: '^\[(?:F1|F3)\].*美国.*(?:\||\s)0?1$'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    timeout: 5000
    tolerance: 20
    lazy: true
    expected-status: 204
    hidden: true
  - name: 美国02
    type: url-test
    include-all: true
    exclude-type: direct
    filter: '^\[(?:F1|F3)\].*美国.*(?:\||\s)0?2$'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    timeout: 5000
    tolerance: 20
    lazy: true
    expected-status: 204
    hidden: true

[Overwrite]
# 地区手动组 / Auto 组：排除原始 F1/F3，并加入对应的合并组
ruby_edit "$CONFIG_FILE" "['proxy-groups'][Value['proxy-groups'].index{|x|x.is_a?(Hash)&&x['name']=='🇭🇰HK'}]['proxies']" "(Value['proxy-groups'][Value['proxy-groups'].index{|x|x.is_a?(Hash)&&x['name']=='🇭🇰HK'}]['proxies'].to_a + ['香港01','香港02']).uniq"
ruby_edit "$CONFIG_FILE" "['proxy-groups'][Value['proxy-groups'].index{|x|x.is_a?(Hash)&&x['name']=='🇭🇰HK'}]['exclude-filter']" "'^\[(?:F1|F3)\]'"
ruby_edit "$CONFIG_FILE" "['proxy-groups'][Value['proxy-groups'].index{|x|x.is_a?(Hash)&&x['name']=='🇭🇰HK-Auto'}]['proxies']" "(Value['proxy-groups'][Value['proxy-groups'].index{|x|x.is_a?(Hash)&&x['name']=='🇭🇰HK-Auto'}]['proxies'].to_a + ['香港01','香港02']).uniq"
